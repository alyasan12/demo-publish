<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布成功 · HTML → GitHub Pages</title>
<style>
  :root { --ink:#12161c; --muted:#66707d; --line:#e6e9ef; --brand:#2f6fed; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 15% -10%, #e8f0ff 0%, transparent 60%),
      radial-gradient(700px 400px at 100% 0%, #fdeef2 0%, transparent 55%),
      #fbfcfe;
  }
  .card {
    width:min(680px, 92vw); padding:48px 44px;
    background:#fff; border:1px solid var(--line); border-radius:20px;
    box-shadow:0 24px 60px -30px rgba(18,22,28,.25);
  }
  .tag {
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:.04em; color:#0f7b35;
    background:#eaf7ef; border:1px solid #cdebd8; padding:6px 12px; border-radius:999px;
  }
  h1 { margin:22px 0 12px; font-size:34px; line-height:1.25; letter-spacing:-.02em; }
  p  { margin:0 0 14px; color:var(--muted); line-height:1.75; font-size:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:26px; }
  .row a {
    text-decoration:none; font-size:15px; padding:11px 18px; border-radius:10px;
    border:1px solid var(--line); color:var(--ink); transition:.15s;
  }
  .row a.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .row a:hover { transform:translateY(-1px); box-shadow:0 6px 18px -8px rgba(18,22,28,.3); }
  footer { margin-top:34px; padding-top:18px; border-top:1px solid var(--line); font-size:13px; color:#98a1ad; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:13px; background:#f3f5f8; padding:2px 6px; border-radius:5px; }
</style>
</head>
<body>
  <main class="card">
    <span class="tag">● 已部署到 GitHub Pages</span>
    <h1>这张页面是从本地 HTML<br>一键发布上来的。</h1>
    <p>
      由 <code>html-to-github-pages</code> 技能驱动本机 Microsoft Edge 完成：
      检查同名仓库、删除重建、改名 <code>index.html</code>、上传提交、开启 Pages，
      最后等待构建完成并刷新验证。
    </p>
    <p>现在这个地址可以直接分享给任何人。</p>
    <div class="row">
      <a class="primary" href="https://github.com" target="_blank" rel="noopener">查看 GitHub</a>
      <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages 是什么</a>
    </div>
    <footer>发布自本地文件 · 单文件 HTML · 无需服务器</footer>
  </main>
</body>
</html>
